name: Compiler le CV LaTeX

on:
  push:
    paths:
      - '**.tex'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer XeLaTeX + moderncv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-french \
            fonts-font-awesome

      - name: Compiler le CV
        run: |
          xelatex -interaction=nonstopmode cv_fr.tex
          xelatex -interaction=nonstopmode cv_fr.tex

      - name: Pousser le PDF généré
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CV_Benhirt_FatimaEzzahra_FR.pdf || git add *.pdf
          git diff --cached --quiet || git commit -m "📄 CV mis à jour automatiquement"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
